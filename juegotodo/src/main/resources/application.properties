# Lee las variables locales desde el archivo .env (en raíz o subcarpeta juegotodo)
spring.config.import=optional:file:.env[.properties],optional:file:juegotodo/.env[.properties]

# Conexión a PostgreSQL en Neon
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# Hibernate / JPA (crea y actualiza las tablas en Neon automáticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Puerto y orígenes CORS permitidos para el frontend
server.port=${PORT:8080}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4200,http://localhost:8081}

# Configuración JWT
jwt.secret=${JWT_SECRET:ClaveSecretaSuperSeguraParaJuegotodo2026ConMasDe32Caracteres}
jwt.expiration=86400000

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html